{{define "title"}}ARH3D{{end}}
{{template "layout" .}}

{{define "content"}}

<div class="flex flex-col items-center justify-center min-h-[75vh] text-center p-10">

    <h1 class="text-4xl font-extrabold text-emerald-500 mb-6">ARH3D</h1>
    <p class="text-lg text-slate-400 mb-10 max-w-xl">
        Welcome to ARH3D. Choose an action below.
    </p>

    <div class="flex flex-col gap-4 w-full max-w-xs">

        <button
            class="w-full rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-6 py-3 shadow transition focus:outline-none focus:ring-2 focus:ring-emerald-400"
            onclick="location.href='/new'"
        >
            Submit New Print Job
        </button>

        <button
            class="w-full rounded-lg border border-emerald-500 text-emerald-500 font-semibold px-6 py-3 bg-transparent hover:bg-emerald-50/10 transition"
            onclick="location.href='/status'"
        >
            See Print Status
        </button>

    </div>
</div>

{{end}}

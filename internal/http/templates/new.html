{{define "title"}}ARH3D{{end}}
{{template "layout" .}}

{{define "content"}}
<div class="max-w-lg mx-auto mt-10 mb-8 bg-slate-800/90 border border-slate-700 p-8 rounded-xl shadow-lg">
    <div class="flex items-center justify-between mb-2 text-sm text-slate-400">
        <span>
            Logged in as <span class="font-semibold text-slate-100">{{.User.Name}}</span> ({{.User.Email}})
        </span>
        <button
            type="button"
            class="text-xs text-emerald-400 hover:underline"
            onclick="location.href='/status'"
        >
            View my requests
        </button>
    </div>

    <h1 class="text-2xl font-bold mb-4 text-slate-100">New Print Request</h1>
    <p class="text-sm text-slate-400 mb-6">
        Tell us what you want to print. We’ll put it into the queue and update the status as it progresses.
    </p>

    <form
        method="POST"
        action="/new"
        enctype="multipart/form-data"
        class="space-y-6"
        onsubmit="return validateForm()"
    >
        <div>
            <label class="block text-slate-300 mb-1 font-medium">What do you have?</label>
            <div class="flex flex-col gap-1 text-sm text-slate-200">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="input_type" value="file" onchange="showInput(this)" />
                    I have a 3D model file ready
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="input_type" value="link" onchange="showInput(this)" />
                    I have a link to a model
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="input_type" value="description" onchange="showInput(this)" />
                    I want to describe the object <span class="text-xs text-slate-100">(we will e-mail you to confirm the design)</span>
                </label>
            </div>
        </div>

        <div id="file-input" class="hidden">
            <label class="block text-slate-300 mb-1 font-medium">Upload 3D print file</label>
            <label
                class="w-full flex flex-col items-center px-4 py-6 bg-slate-900 text-slate-200 rounded-lg shadow-lg tracking-wide border border-dashed border-slate-600 cursor-pointer hover:bg-slate-800 transition"
            >
                <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M7 16v4h10v-4M12 12V4m0 0L8 8m4-4l4 4" />
                </svg>
                <span class="text-sm leading-normal">
                    Choose a file (.3mf, .stl, .gcode, .obj, .amf)
                </span>
                <input
                    type="file"
                    id="file"
                    name="file"
                    class="hidden"
                    accept=".3mf,.stl,.gcode,.obj,.amf"
                />
            </label>
        </div>

        <div id="link-input" class="hidden">
            <label for="link" class="block text-slate-300 mb-1 font-medium">Link to a model</label>
            <input
                type="url"
                id="link"
                name="link"
                placeholder="https://example.com/model.stl"
                class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-100 placeholder-slate-500"
            />
        </div>

        <div id="description-input" class="hidden">
            <label for="description" class="block text-slate-300 mb-1 font-medium">Describe the object</label>
            <textarea
                id="description"
                name="description"
                rows="3"
                placeholder="What should it look like, how big, any special details…"
                class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-100 placeholder-slate-500"
            ></textarea>
        </div>

        <div>
            <label for="colour" class="block text-slate-300 mb-1 font-medium">Colour</label>
            <div class="flex items-center space-x-3">
                <select
                    id="colour"
                    name="colour"
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-100"
                    onchange="showColourPreview(this)"
                    required
                >
                    <option value="" disabled selected>Select a colour</option>
                    <option value="#ffffff">White</option>
                    <option value="#000000">Black</option>
                    <option value="#ff0000">Red</option>
                    <option value="#00ff00">Green</option>
                    <option value="#0000ff">Blue</option>
                    <option value="#ffff00">Yellow</option>
                    <option value="#ff9900">Orange</option>
                    <option value="#ff00ff">Pink</option>
                    <option value="#808080">Grey</option>
                </select>
                <span
                    id="colour-preview"
                    class="inline-block w-8 h-8 rounded border border-slate-600 bg-white"
                ></span>
            </div>
        </div>

        <div>
            <label for="comments" class="block text-slate-300 mb-1 font-medium">Additional comments</label>
            <textarea
                id="comments"
                name="comments"
                rows="3"
                placeholder="Any deadlines, special instructions, or context?"
                class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-100 placeholder-slate-500"
            ></textarea>
            <span class="text-sm text-slate-200">If your request is urgent, please contact x</span>
        </div>

        <div class="flex justify-end">
            <button
                type="submit"
                class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-6 py-2 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-emerald-400"
            >
                Submit request
            </button>
        </div>
    </form>
</div>

<script>
function showColourPreview(sel) {
    const preview = document.getElementById("colour-preview");
    preview.style.backgroundColor = sel.value || "#fff";
}
document.addEventListener("DOMContentLoaded", function () {
    const select = document.getElementById("colour");
    if (select) showColourPreview(select);
});

function showInput(radio) {
    document.getElementById("file-input").classList.add("hidden");
    document.getElementById("link-input").classList.add("hidden");
    document.getElementById("description-input").classList.add("hidden");

    if (radio.value === "file") document.getElementById("file-input").classList.remove("hidden");
    if (radio.value === "link") document.getElementById("link-input").classList.remove("hidden");
    if (radio.value === "description") document.getElementById("description-input").classList.remove("hidden");
}

function validateForm() {
    const selected = document.querySelector('input[name="input_type"]:checked');
    if (!selected) {
        alert("Please choose what kind of input you have.");
        return false;
    }
    if (selected.value === "file" && document.getElementById("file").files.length === 0) {
        alert("Please select a file to upload.");
        return false;
    }
    if (selected.value === "link" && document.getElementById("link").value.trim() === "") {
        alert("Please enter a link.");
        return false;
    }
    if (selected.value === "description" && document.getElementById("description").value.trim() === "") {
        alert("Please describe what you want to print.");
        return false;
    }
    return true;
}
</script>
{{end}}
